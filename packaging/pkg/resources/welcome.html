<h2>ZTab</h2>
<p>A Windows-style window switcher: hold <b>⌥</b> and press <b>Tab</b> to see every window, grouped by app; <b>⌥`</b> switches between the windows of the current app.</p>
<p>ZTab is installed into <b>Applications</b> in your home folder and starts at login (change this in ZTab's Settings).</p>
